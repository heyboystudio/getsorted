trade: painting
name: Painting
status: demo
services:
  - key: interior_painting
    name: Interior painting
    description: Walls and ceilings inside the home.
    requires_registration: null
    emergency_capable: false
    questions:
      - key: rooms
        prompt: How much needs painting?
        type: single_choice
        options: [One wall, One room, 2–4 rooms, Whole interior]
        required: true
      - key: prep
        prompt: Any cracks, peeling or damp patches?
        type: yes_no
        required: true

  - key: exterior_painting
    name: Exterior painting
    description: Outside walls, boundary walls, trims.
    requires_registration: null
    emergency_capable: false
    questions:
      - key: storeys
        prompt: How many storeys?
        type: single_choice
        options: [Single storey, Double storey, Boundary wall only]
        required: true

  - key: roof_waterproofing
    name: Roof painting and waterproofing
    description: Waterproof and paint roofs, fix leaks through the roof (common with coastal weather).
    requires_registration: null
    emergency_capable: false
    questions:
      - key: roof_type
        prompt: What kind of roof?
        type: single_choice
        options: [Tiles, Corrugated iron, Concrete flat roof, IBR sheeting, Not sure]
        required: true
      - key: leaking_now
        prompt: Is it leaking inside right now?
        type: yes_no
        required: true

  - key: damp_treatment
    name: Damp and mould treatment
    description: Rising or penetrating damp, mould and peeling paint from humidity.
    requires_registration: null
    emergency_capable: false
    questions:
      - key: damp_where
        prompt: Where is the damp?
        type: multi_choice
        options: [Bottom of walls, Ceiling, Around windows, Bathroom, Outside walls]
        required: true
