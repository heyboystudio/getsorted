trade: electrical
name: Electrical
status: demo
services:
  - key: fault_finding
    name: Fault finding
    description: Tripping breakers, no power to part of the house, burning smell or sparking.
    requires_registration: electrical_registered_person
    emergency_capable: true
    questions:
      - key: symptom
        prompt: What's happening?
        type: single_choice
        options: [Breaker or earth leakage keeps tripping, No power to part of the house, No power at all, Burning smell or sparks, Flickering lights]
        required: true
        flags:
          urgent_if: [Burning smell or sparks, No power at all]
      - key: when
        prompt: When does it happen?
        type: single_choice
        options: [All the time, When a certain appliance is on, When it rains, Randomly]
        required: false
    safety_advice:
      - If you smell burning or see sparks, switch off the main switch at the DB board and keep away.
      - Don't keep resetting a breaker that trips repeatedly.

  - key: electrical_coc
    name: Electrical Certificate of Compliance (CoC)
    description: CoC for selling a property or after electrical work.
    requires_registration: electrical_registered_person
    emergency_capable: false
    questions:
      - key: phase
        prompt: Single phase or three phase supply?
        type: single_choice
        options: [Single phase, Three phase, Not sure]
        required: true
      - key: reason
        prompt: Why do you need it?
        type: single_choice
        options: [Selling the property, After new electrical work, Insurance, Other]
        required: true

  - key: lights_plugs
    name: Lights, plugs and switches
    description: Install or repair light fittings, plug points and switches.
    requires_registration: electrical_registered_person
    emergency_capable: false
    questions:
      - key: job_type
        prompt: Install new or repair existing?
        type: single_choice
        options: [Install new, Repair or replace existing]
        required: true
      - key: count
        prompt: How many points?
        type: number
        required: false

  - key: backup_power
    name: Backup power
    description: Inverter, battery or solar backup installation or repair.
    requires_registration: electrical_registered_person
    emergency_capable: false
    questions:
      - key: backup_job
        prompt: What do you need?
        type: single_choice
        options: [New inverter and battery, New solar with battery, Repair existing system, Advice on sizing]
        required: true
