trade: tiling
name: Tiling
status: demo
services:
  - key: floor_tiling
    name: Floor tiling
    description: Tile a new floor or replace an existing one.
    requires_registration: null
    emergency_capable: false
    questions:
      - key: area
        prompt: Roughly how big is the area?
        type: single_choice
        options: [Under 10 m², 10–30 m², 30–60 m², Over 60 m², Not sure]
        required: true
      - key: existing
        prompt: Do old tiles need to be lifted first?
        type: yes_no
        required: true

  - key: wall_tiling
    name: Wall tiling
    description: Bathroom, kitchen splashback or feature walls.
    requires_registration: null
    emergency_capable: false
    questions:
      - key: room
        prompt: Which room?
        type: single_choice
        options: [Bathroom, Kitchen, Other]
        required: true

  - key: tile_repair
    name: Tile repair and regrouting
    description: Replace cracked or hollow tiles, regrout or reseal.
    requires_registration: null
    emergency_capable: false
    questions:
      - key: issue
        prompt: What's the problem?
        type: single_choice
        options: [Cracked tiles, Hollow or lifting tiles, Grout crumbling or mouldy, Leaking shower]
        required: true

  - key: shower_waterproofing
    name: Shower waterproofing
    description: Waterproof a shower base or wet area before or during tiling.
    requires_registration: null
    emergency_capable: false
    questions:
      - key: water_damage
        prompt: Is water coming through to another room or ceiling?
        type: yes_no
        required: true
